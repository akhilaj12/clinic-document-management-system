server.port=8082
spring.application.name=notification-service

aws.region=ap-south-1
aws.accessKeyId=access_key
aws.secretAccessKey=secret_access_key
aws.sns.topic-arn=arn:aws:sns:ap-south-1:954728790554:clinic-dms-notifications

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
kafka.topic.document-events=document-events
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.clinic.notification_service.dto.DocumentEvent

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

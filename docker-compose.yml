services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true

  eureka-server:
    image: akhila12j/clinic-eureka
    ports:
      - "8761:8761"

  document-service:
    image: akhila12j/clinic-document
    ports:
      - "8081:8081"
    depends_on: [kafka, eureka-server]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/


  notification-service:
    image: akhila12j/clinic-notification
    ports:
      - "8082:8082"
    depends_on: [kafka, eureka-server]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  audit-service:
    image: akhila12j/clinic-audit
    ports:
      - "8083:8083"
    depends_on: [kafka, eureka-server]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  api-gateway:
    image: akhila12j/clinic-gateway
    ports:
      - "8080:8080"
    depends_on: [eureka-server]
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  frontend:
    image: akhila12j/clinic-frontend
    ports:
      - "5173:80"